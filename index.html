<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#8C1D30"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SCFC minutos"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>html{color-scheme:light dark}body{margin:0}</style></head><body><title>Sant Cugat FC 2026/2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: launchpad of app tiles under a garnet club header; every other screen is one column with a sticky title bar. */
:root{
  --bg:#F5F1EE; --surface:#FFFFFF; --surface-2:#EDE6E3; --ink:#1E1517; --ink-2:#5F5256; --ink-3:#85787C; --line:#E0D6D5;
  --accent:#8C1D30; --accent-2:#5E1020; --on-accent:#FFFFFF; --accent-ink:#8C1D30; --accent-soft:#F3E3E4;
  --gold:#E2B03B; --on-gold:#3A2B00;
  --good:#0A7F0A; --good-bg:#E2F3E2; --warn:#8A5A00; --warn-bg:#FBEFD2; --bad:#B72C2C; --bad-bg:#F8E1E1;
  --shadow:0 1px 2px rgba(50,15,20,.08),0 8px 24px rgba(50,15,20,.07);
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --series-6:#008300; --series-7:#6250d6; --series-8:#e34948;
  --grid:#E6DEDC; --hatch:#E4DAD8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130D0F; --surface:#1D1517; --surface-2:#2A1F22; --ink:#F5EEF0; --ink-2:#CDBFC3; --ink-3:#9B8C91; --line:#3A2D31;
  --accent:#B02A42; --accent-2:#4A0D19; --on-accent:#FFFFFF; --accent-ink:#F08A9C; --accent-soft:#3A1D24;
  --gold:#E8BA4C; --on-gold:#2E2200;
  --good:#4CC24C; --good-bg:#17301A; --warn:#F0B83A; --warn-bg:#3A2D10; --bad:#F27A7A; --bad-bg:#3C1A1A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
  --grid:#33272B; --hatch:#2D2124; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130D0F; --surface:#1D1517; --surface-2:#2A1F22; --ink:#F5EEF0; --ink-2:#CDBFC3; --ink-3:#9B8C91; --line:#3A2D31;
  --accent:#B02A42; --accent-2:#4A0D19; --on-accent:#FFFFFF; --accent-ink:#F08A9C; --accent-soft:#3A1D24;
  --gold:#E8BA4C; --on-gold:#2E2200;
  --good:#4CC24C; --good-bg:#17301A; --warn:#F0B83A; --warn-bg:#3A2D10; --bad:#F27A7A; --bad-bg:#3C1A1A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
  --grid:#33272B; --hatch:#2D2124; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
.wrap{max-width:1080px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.bar h1{font-size:26px;line-height:1;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--surface);border:1px solid var(--line)}
.iconbtn:active{transform:scale(.96)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.sync em{font-style:normal}
.sync.full em{display:inline!important}
.sync.warn i{background:var(--gold)}.sync.bad i{background:var(--bad)}
@media(max-width:560px){.sync em{display:none}}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync.ok i{background:var(--good)}
.crestbtn img{width:30px;height:30px}

/* hero */
.hero{margin-top:8px;border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden;
  background:
   linear-gradient(115deg,rgba(0,0,0,.0) 62%,rgba(226,176,59,.20) 62%,rgba(226,176,59,.20) 66%,rgba(0,0,0,0) 66%),
   linear-gradient(135deg,var(--accent-2),var(--accent) 70%)}
.hero-top{display:flex;gap:16px;align-items:center}
.hero img.big{width:88px;height:88px;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.hero h1{font-size:clamp(34px,9vw,54px);line-height:.92;text-transform:uppercase}
.hero h1 span{color:var(--gold);display:block}
.hero p{margin:8px 0 0;font-size:14px;opacity:.88}
.next{margin-top:18px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.next .lbl{color:#fff;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;width:100%}
.next .teams{display:flex;align-items:center;gap:10px;width:100%;min-width:0}
.next .btn{width:100%}
.next .teams img{width:40px;height:40px}
.next .vs{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.05;min-width:0;flex:1;text-align:center;text-transform:uppercase}
.next .vs small{display:block;font-family:var(--font-body);font-weight:500;font-size:13px;opacity:.85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px;background:var(--accent);color:var(--on-accent);border:1px solid transparent}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:active{transform:scale(.98)}

/* launchpad */
.pad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media(min-width:720px){.pad{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:148px;box-shadow:var(--shadow);transition:transform .12s ease}
.tile:hover{transform:translateY(-2px)}
.tile:active{transform:scale(.98)}
.tile .glyph{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:24px}
.tile h2{font-size:23px;line-height:1;text-transform:uppercase}
.tile p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.3}
.tile .tag{margin-top:auto;font-size:12px;font-weight:600;color:var(--accent-ink)}
.tile.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.tile.primary .glyph{background:var(--gold);color:var(--on-gold)}
.tile.primary p,.tile.primary .tag{color:rgba(255,255,255,.86)}

/* generic blocks */
.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 65px);z-index:19;background:var(--bg);padding-block:6px;margin-block:-6px;border-bottom:1px solid transparent}
.page{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.card h2{font-size:22px;text-transform:uppercase;margin-bottom:4px}
.card .sub{font-size:13px;color:var(--ink-2);margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-height:40px;padding:0 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.note{font-size:13px;background:var(--surface-2);border-radius:12px;padding:10px 12px;color:var(--ink-2)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2)}
.empty h2{color:var(--ink);margin-bottom:6px}
field-label,.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 12px;width:100%}
input[type=number]{-moz-appearance:textfield}

/* match head */
.mhead{display:flex;align-items:center;justify-content:center;gap:14px;text-align:center}
.mhead .t{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;min-width:0}
.mhead .t img{width:60px;height:60px}
.mhead .t b{font-family:var(--font-display);font-size:18px;line-height:1;text-transform:uppercase}
.mhead .mid{font-family:var(--font-display);font-weight:700;font-size:28px;color:var(--ink-3)}
.mmeta{text-align:center;font-size:13px;color:var(--ink-2);margin-top:6px}

/* convocatoria chips */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 10px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);text-align:left;min-width:0}
.chip .n{font-family:var(--font-display);font-weight:700;font-size:18px;min-width:26px;text-align:center;color:var(--accent-ink)}
.chip .nm{flex:1;min-width:0;font-weight:500;font-size:14px;line-height:1.15}
.chip .st{font-size:11px;font-weight:600;display:block;color:var(--ink-2)}
.chip.d{background:var(--surface-2);color:var(--ink-3);border-style:dashed}
.chip.d .nm{text-decoration:line-through}
.chip.n0{border-style:dashed;border-color:var(--gold)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.chip.out.sel{border-color:var(--bad);background:var(--bad-bg)}
.chip.inn.sel{border-color:var(--good);background:var(--good-bg)}
.chip[disabled]{opacity:.38;cursor:not-allowed}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* sub form */
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:14px;background:var(--surface-2);font-size:22px;display:grid;place-items:center}
.stepper input{width:84px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:28px;min-height:48px;padding:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{min-height:34px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.two{grid-template-columns:1fr 1fr}}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .when{font-family:var(--font-display);font-weight:700;font-size:20px;min-width:74px;line-height:1.1}
.ev .when small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--ink-2)}
.ev .who{flex:1;min-width:0;font-size:14px}
.ev.editing{background:var(--accent-soft);border-radius:12px;padding-inline:8px}
.ev .who .o{color:var(--bad);font-weight:600}.ev .who .i{color:var(--good);font-weight:600}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:right;padding:8px 8px;white-space:nowrap}
th.l,td.l{text-align:left}
td{padding:9px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
td.name{white-space:normal;font-weight:500}
.rank{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--ink-3);width:34px}
.rank.top{color:var(--accent-ink)}
.barcell{width:34%;min-width:90px}
th.c,td.c{text-align:center}
table.rk td{padding-block:5px}table.rk th{padding-block:6px}
table.rk td.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;width:100%;font-size:14px}
table.rk .dn{display:inline-block;min-width:20px;color:var(--ink-3);font-size:12px;font-weight:600}
table.rk .rank{font-size:16px;width:24px}table.rk .bigv{font-size:18px}
table.rk tr.hl td{background:var(--accent-soft)}
table.rk tr.hl td:first-child{border-radius:8px 0 0 8px}table.rk tr.hl td:last-child{border-radius:0 8px 8px 0}
.two-tables .card{padding:12px}.two-tables .card h2{font-size:18px;margin:0 0 2px}.two-tables .card .sub{font-size:12px;margin:0 0 8px}
.bar-t{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bigv{font-family:var(--font-display);font-weight:700;font-size:22px}
.two-tables{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:960px){.two-tables{grid-template-columns:1fr 1fr}.two-tables .only-narrow{display:none}.two-tables>.card{display:block!important}}
.two-tables>.card.hide{display:none}
@media(min-width:960px){.medias-tabs{display:none}}
.two-tables>*,.page>*{min-width:0}
@media(max-width:560px){th,td{padding-left:4px;padding-right:4px}.rank{width:26px}td.name{min-width:84px}.barcell{display:none}.calrow .tx b{font-size:16px}.calrow .tm img{width:30px;height:30px}}

/* calendar */
.cal{display:flex;flex-direction:column}
.calrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line);text-align:left;width:100%}
.calrow:first-child{border-top:0}
.calrow .jn{font-family:var(--font-display);font-weight:700;font-size:22px;width:34px;color:var(--ink-3);text-align:center;line-height:1}
.calrow .jn small{display:block;font-family:var(--font-body);font-size:9px;letter-spacing:.06em;font-weight:600}
.calrow .tm{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.calrow .tm img{width:34px;height:34px;flex:none}
.calrow .tx{min-width:0}
.calrow .tx b{display:block;font-family:var(--font-display);font-size:19px;line-height:1.05;text-transform:uppercase}
.calrow .tx span{font-size:12px;color:var(--ink-2)}
.calrow.next-up{background:var(--accent-soft);border-radius:14px;border-top-color:transparent}

/* manual rows */
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .n{font-family:var(--font-display);font-weight:700;font-size:20px;width:30px;text-align:center;color:var(--accent-ink)}
.mrow .nm{flex:1;min-width:0;font-weight:500}
.mrow input{width:76px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:22px;min-height:44px;padding:0}
.mrow .q{display:flex;gap:4px}
.mrow .q button{min-width:40px;min-height:36px;border-radius:10px;background:var(--surface-2);font-size:13px;font-weight:600;padding:0 8px}
.totalbar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);margin-top:12px}

/* charts */
.chartbox{position:relative;width:100%;height:340px}
@media(max-width:560px){.chartbox{height:300px}}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lchip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.lchip[aria-pressed="true"]{border-color:var(--ink-3);background:var(--surface-2)}
.lchip .dot{background:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface-2);border-radius:16px;padding:12px}
.kpi b{display:block;font-family:var(--font-display);font-size:30px;line-height:1.05}
.kpi span{font-size:12px;color:var(--ink-2)}
.heat{border-collapse:separate;border-spacing:2px;font-size:12px;width:auto}
.heat th{padding:2px;text-align:center;font-size:10px;vertical-align:bottom}
.heat th img{width:24px;height:24px;display:block;margin:0 auto 2px}
.heat td{padding:0;border:0;text-align:center;min-width:34px;height:30px;border-radius:6px;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.heat td.na{background:repeating-linear-gradient(45deg,var(--hatch),var(--hatch) 3px,transparent 3px,transparent 6px)}
.heat td.pn{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:0 8px 0 0;font-weight:500;min-width:120px;max-width:150px;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.heat td.tot{font-family:var(--font-display);font-size:16px;min-width:46px;color:var(--ink)}
details{margin-top:12px}
summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent-ink);min-height:36px;display:flex;align-items:center}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,4,6,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.veil{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media(min-width:720px){.sheet{border-radius:24px}}
.sheet h2{font-size:26px;text-transform:uppercase;margin-bottom:10px}
.sheet .acts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:10px 6px;border-top:1px solid var(--line);text-align:left}
.pick:first-of-type{border-top:0}

/* Cálculo de minutos a partir de convocatoria + cambios */
const evT=e=>e.h===1?e.m:HALF+e.m;
function sortedEvents(events){return events.map((e,i)=>({...e,t:evT(e),i})).sort((a,b)=>a.t-b.t||a.i-b.i)}
function timelineOf(events,pid){const tl=[];sortedEvents(events).forEach(e=>{if((e.out||[]).includes(pid))tl.push({t:e.t,type:'out'});if((e.inn||[]).includes(pid))tl.push({t:e.t,type:'in'})});return tl}
function playerMinutes(tl){
  if(!tl.length)return MIN;
  let on=tl[0].type==='out',since=0,total=0;
  for(const ev of tl){if(ev.type==='out'){if(on){total+=ev.t-since;on=false}}else{if(!on){on=true;since=ev.t}}}
  if(on)total+=MIN-since;return total;
}
function timelineValid(tl){for(let i=1;i<tl.length;i++)if(tl[i].type===tl[i-1].type)return false;return true}
function computeMinutes(m){
  const out={};
  S.players.forEach(p=>{const st=(m.conv||{})[p.id]||'c';
    if(p.active===false&&st==='c'&&!(m.events||[]).some(e=>(e.out||[]).includes(p.id)||(e.inn||[]).includes(p.id))&&!(m.minutes&&p.id in m.minutes))return;
    if(st==='d')return;if(st==='n'){out[p.id]=0;return}
    out[p.id]=playerMinutes(timelineOf(m.events||[],p.id))});
  return out;
}

  const pa=a.playersAt||0,pb=b.playersAt||0;
  const players=pb>pa?b.players:pa>pb?a.players:((a.players||[]).length?a.players:b.players);
  const dels={...(a.deleted||{})};Object.entries(b.deleted||{}).forEach(([k,t])=>{dels[k]=Math.max(dels[k]||0,t)});
  const out={app:'scfc-2026-27',version:2,players:players||[],playersAt:Math.max(pa,pb),matches:{},deleted:dels};
  new Set([...Object.keys(a.matches||{}),...Object.keys(b.matches||{})]).forEach(k=>{
    const ma=(a.matches||{})[k],mb=(b.matches||{})[k];
    const best=!ma?mb:!mb?ma:((mb.updatedAt||0)>=(ma.updatedAt||0)?mb:ma);
    if((dels[k]||0)>(best.updatedAt||0))return;out.matches[k]=best});
  return out}
async function ghErr(r){let m='';try{m=(await r.json()).message}catch(e){}
  return {code:r.status===401?'auth':r.status===403?'forbidden':r.status===404?'notfound':'http',status:r.status,message:m||('Error '+r.status)}}
const GH={cfg:null,sha:null,busy:false,again:false,timer:null,status:'idle',last:0,err:'',
  load(){try{this.cfg=JSON.parse(localStorage.getItem(GHK)||'null')}catch(e){this.cfg=null}},
  url(c){return 'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+c.path.split('/').map(encodeURIComponent).join('/')},
  hdr(c){return {'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'}},
  async get(c=this.cfg){
    const r=await fetch(this.url(c)+(c.branch?'?ref='+encodeURIComponent(c.branch):''),{headers:this.hdr(c),cache:'no-store'});
    if(r.status===404)return {missing:true};
    if(!r.ok)throw await ghErr(r);
    const j=await r.json();
    if(j.encoding!=='base64'||!j.content)throw {code:'big',message:'El archivo de datos no se puede leer (¿demasiado grande?).'};
    return {data:JSON.parse(b64dec(j.content)),sha:j.sha}},
  async put(data,sha,c=this.cfg){
    const body={message:'Datos '+new Date().toISOString().slice(0,16).replace('T',' '),content:b64enc(JSON.stringify(data)),...(sha?{sha}:{}),...(c.branch?{branch:c.branch}:{})};
    const r=await fetch(this.url(c),{method:'PUT',headers:{...this.hdr(c),'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===409||r.status===422)throw {code:'conflict'};
    if(!r.ok)throw await ghErr(r);
    return (await r.json()).content.sha}};
function ghMsg(e){
  if(e instanceof TypeError)return 'Sin conexión con GitHub.';
  if(e&&e.code==='auth')return 'Token no válido o caducado.';
  if(e&&e.code==='forbidden')return 'GitHub ha rechazado la petición: revisa los permisos del token o espera un poco (límite de uso).';
  if(e&&e.code==='notfound')return 'No encuentro el repositorio. Revisa usuario y nombre; si es privado, el token debe tener acceso a él.';
  return (e&&e.message)||'Error desconocido.'}
function setSync(status,err){GH.status=status;GH.err=err||'';if(status==='ok')GH.last=Date.now();
  document.querySelectorAll('[data-sync]').forEach(el=>{el.outerHTML=syncBadge(el.dataset.sync==='full')});

const Store={mode:'local',db:null,w:{},got:{},dirty:false,rev:0,
  async init(){
    let db=null,user=null;
    try{if(window.claude&&window.claude.use){db=await window.claude.use('db');user=await window.claude.use('user')}}catch(e){}
    if(db){this.mode='db';this.db=db;S.mode='db';
      try{if(user&&user.can){const c=await user.can('data.write');if(c===false)S.canWrite=false}}catch(e){}
      const timer=setTimeout(()=>{if(!S.ready){S.slow=true;render()}},10000);
      const done=k=>{this.got[k]=true;if(this.got.players&&this.got.matches){S.ready=true;S.slow=false;clearTimeout(timer)}schedule()};
      db.doc('squad/players').onSnapshot(s=>{S.players=s.exists?(s.data().list||[]):[];done('players')},e=>{S.slow=true;schedule()});
      db.collection('matches').onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();if(x&&x.j)m[x.j]=x});S.matches=m;done('matches')},e=>{S.slow=true;schedule()});
      return}
    GH.load();this.loadLocal();
    if(GH.cfg){this.mode='gh';S.mode='gh';
      const has=S.players.length||Object.keys(S.matches).length;
      if(has){S.ready=true;render();this.sync()}
      else{S.ready=false;const t=setTimeout(()=>{S.slow=true;render()},8000);await this.sync();clearTimeout(t);S.slow=false;S.ready=true}
      setInterval(()=>{if(document.visibilityState==='visible')this.sync()},60000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')this.sync()});
      window.addEventListener('online',()=>this.sync());
    }else{this.mode='local';S.mode='local';S.ready=true}
  },
  loadLocal(){let d=null;try{d=JSON.parse(localStorage.getItem(LSK)||'null')}catch(e){}
    if(!d||!d.players){d=clone(SEED);d.dirty=false}
    S.players=d.players;S.matches={};Object.values(d.matches||{}).forEach(m=>S.matches[m.j]=m);
    S.meta={playersAt:d.playersAt||0,deleted:d.deleted||{}};this.dirty=!!d.dirty;this.persistLocal()},
  persistLocal(){try{localStorage.setItem(LSK,JSON.stringify({...snapshot(),dirty:this.dirty}))}catch(e){}},
  touch(){this.rev++;this.dirty=true;this.persistLocal();if(this.mode==='gh'){clearTimeout(GH.timer);GH.timer=setTimeout(()=>this.sync(),900);setSync('pending')}},
  adopt(d){S.players=d.players||[];S.matches={};Object.values(d.matches||{}).forEach(m=>S.matches[m.j]=m);S.meta={playersAt:d.playersAt||0,deleted:d.deleted||{}};this.persistLocal();schedule()},
  async sync(){
    if(this.mode!=='gh'||!GH.cfg)return;
    if(GH.busy){GH.again=true;return}
    GH.busy=true;if(this.dirty)setSync('saving');
    try{
      for(let k=0;k<4;k++){
        const rem=await GH.get();
        if(!this.dirty&&!rem.missing){if(rem.sha!==GH.sha){GH.sha=rem.sha;this.adopt(rem.data)}break}
        const rev0=this.rev,local=snapshot();
        const merged=rem.missing?local:mergeData(rem.data,local);
        if(!rem.missing&&JSON.stringify(merged)===JSON.stringify(rem.data)){GH.sha=rem.sha;if(this.rev===rev0){this.dirty=false;this.adopt(merged)}break}
        try{
          GH.sha=await GH.put(merged,rem.missing?null:rem.sha);
          if(this.rev===rev0){this.dirty=false;this.adopt(merged)}else GH.again=true;
          break
        }catch(e){if(e.code!=='conflict'||k===3)throw e}
      }
      this.persistLocal();setSync(this.dirty?'pending':'ok')
    }catch(e){setSync('error',ghMsg(e))}
    finally{GH.busy=false;if(GH.again){GH.again=false;this.sync()}}
  },
  queue(path,fn){this.w[path]=(this.w[path]||Promise.resolve()).then(fn).catch(()=>toast('No se ha podido guardar. Revisa la conexión.'))},
  guard(){if(!S.canWrite){toast('Solo lectura: no tienes permiso para editar.');return false}return true},
  savePlayers(list){if(!this.guard())return false;
    S.players=list;S.meta.playersAt=Date.now();
    if(this.mode==='db')this.queue('squad',()=>this.db.doc('squad/players').set({list:clone(list)}));else this.touch();return true},
  saveMatch(m){if(!this.guard())return false;
    m=clone(m);m.updatedAt=Date.now();S.matches[m.j]=m;
    if(this.mode==='db')this.queue('m'+m.j,()=>this.db.doc('matches/j'+pad2(m.j)).set(m));else this.touch();return true},
  delMatch(j){if(!this.guard())return false;
    delete S.matches[j];S.meta.deleted[j]=Date.now();
    if(this.mode==='db')this.queue('m'+j,()=>this.db.doc('matches/j'+pad2(j)).delete());else this.touch();return true},
  async replaceAll(players,matches){this.savePlayers(players);
    Object.keys(S.matches).map(Number).forEach(j=>{if(!matches[j])this.delMatch(j)});
    Object.values(matches).forEach(m=>this.saveMatch(m))}
};

   ${F.out.length!==F.inn.length&&(F.out.length||F.inn.length)?`<div class="note warn" style="margin-top:12px">Salen ${F.out.length} y entran ${F.inn.length}. Puedes guardarlo igualmente.</div>`:''}
   <div class="row" style="margin-top:14px"><button class="btn" data-act="savechange" ${hasMin&&(F.out.length||F.inn.length)?'':'disabled'}>${ic('check')} ${editing?'Guardar modificación':'Guardar cambio'}</button><button class="btn ghost" data-act="cancelchange">Cancelar</button></div></div>`;
}
function playedSummary(j){
  const m=mat(j);const mins=m.minutes||{};const tot=sumOf(mins);
  const rows=orderedPlayers().filter(p=>p.id in mins).map(p=>`<tr><td class="l num" style="width:34px">${p.num??''}</td><td class="l name">${esc(p.name)}</td><td class="bigv num">${mins[p.id]}'</td></tr>`).join('');
  return `<section class="card"><div class="row"><h2 style="margin:0">Partido jugado</h2><span class="spacer"></span>${totPill(tot)}</div>

  <div class="row" style="margin-top:14px"><button class="btn" data-act="gomanual" data-j="${j}">${ic('pen')} Corregir minutos</button><button class="btn ghost" data-act="reopen" data-j="${j}">${ic('undo')} Reabrir con cambios</button></div></section>`;
}
const totPill=tot=>{const d=tot-TEAM_TOTAL;return d===0?`<span class="pill good">${ic('check')} ${tot}' · cuadra</span>`:`<span class="pill warn">${ic('warn')} ${tot}' · ${d>0?'+':''}${d} sobre ${TEAM_TOTAL}'</span>`}

/* ---------- Calendario ---------- */
const STATUS={played:['Jugado','good'],live:['En curso','acc'],pending:['Pendiente','']};
function viewCalendario(){
  const nm=nextMatch();const filt=ui.cal.filter;
  const list=FIX.filter(f=>filt==='all'||(filt==='played'?mat(f.j).status==='played':mat(f.j).status!=='played'));

    <span class="tm">${img(a)}${img(b)}<span class="tx"><b>${esc(TEAMS[a].name)} – ${esc(TEAMS[b].name)}</b><span>${esc(fdate(f.date))} · ${f.home?'casa':'fuera'}</span></span></span>
    <span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="pill ${cls}">${lbl}</span>${sum!=null?`<span class="pill ${sum===TEAM_TOTAL?'':'warn'}">${sum}'</span>`:''}</span></button>`}).join('');
  return `<div class="page"><div class="stick"><div class="seg" role="group" aria-label="Filtro">${[['all','Todos'],['played','Jugados'],['pending','Pendientes']].map(([k,l])=>`<button data-act="calf" data-f="${k}" aria-pressed="${filt===k}">${l}</button>`).join('')}</div></div>

/* ---------- Medias ---------- */
function rankTable(kind){
  const rows=visiblePlayers().map(stats);
  const key=kind==='conv'?'avgConv':'avgTot';
  rows.sort((a,b)=>{const x=a[key]??-1,y=b[key]??-1;return y-x||b.total-a.total||a.p.name.localeCompare(b.p.name)});
  const N=rows[0]?.N||0;
  const pcKey=kind==='conv'?'pctConv':'pctTot';
  return `<div class="tbl-wrap"><table class="rk"><thead><tr><th class="l">#</th><th class="l">Jugador</th><th class="c">Media</th><th class="barcell"></th><th class="c">%</th>${kind==='conv'?'<th class="c">Conv.</th>':''}<th class="c">Total</th></tr></thead><tbody>${
  rows.map((r,i)=>{const v=r[key];const w=v==null?0:Math.min(100,v/MIN*100);
   return `<tr class="${isFocus(r.p)?'hl':''}"><td class="l rank ${i<3&&v!=null?'top':''}">${i+1}</td><td class="l name"><span class="dn">${r.p.num??''}</span>${esc(r.p.name)}</td><td class="c bigv num">${fmt1(v)}</td><td class="barcell"><div class="bar-t"><i style="width:${w}%"></i></div></td><td class="c num">${pct(r[pcKey])}</td>${kind==='conv'?`<td class="c num">${r.conv}</td>`:''}<td class="c num">${r.total}'</td></tr>`}).join('')}</tbody></table></div>`;
}
function viewMedias(){
  const N=playedJs().length;const t=ui.medias.tab;
  return `<div class="page"><div class="row"><span class="pill acc">${N} partidos jugados</span><span class="muted" style="font-size:13px">Ordenado de mayor a menor media</span></div>
  <div class="stick medias-tabs"><div class="seg only-narrow-seg" style="max-width:520px"><button data-act="mtab" data-t="conv" aria-pressed="${t==='conv'}">Sobre convocatorias</button><button data-act="mtab" data-t="total" aria-pressed="${t==='total'}">Sobre partidos totales</button></div></div>
  <div class="two-tables"><section class="card ${t==='conv'?'':'hide'}"><h2>Media sobre convocatorias</h2><p class="sub">Minutos jugados ÷ partidos en los que el jugador estaba convocado. No cuenta los partidos en los que no fue convocado.</p>${rankTable('conv')}</section>
  <section class="card ${t==='total'?'':'hide'}"><h2>Media sobre partidos totales</h2><p class="sub">Minutos jugados ÷ partidos disputados por el equipo (${N}).</p>${rankTable('total')}</section></div></div>`;
}

/* ---------- Gráficos ---------- */
function palette(){const cs=getComputedStyle(document.documentElement);const g=n=>cs.getPropertyValue(n).trim();return {s:[1,2,3,4,5,6,7,8].map(i=>g('--series-'+i)),ink:g('--ink'),ink2:g('--ink-2'),grid:g('--grid'),accent:g('--accent'),surface:g('--surface'),line:g('--line')}}
function topSel(){return visiblePlayers().map(stats).sort((a,b)=>b.total-a.total).slice(0,4).map(s=>s.p.id)}
function defaultSel(){const f=visiblePlayers().filter(isFocus).map(p=>p.id);return f.length?f:topSel()}
function selSlots(){const C=ui.charts;if(!C.sel)C.sel=defaultSel();
  C.sel=C.sel.filter(id=>pById(id));
  Object.keys(C.slot).forEach(id=>{if(!C.sel.includes(id))delete C.slot[id]});
  C.sel.forEach(id=>{if(!(id in C.slot)){const used=Object.values(C.slot);let s=0;while(used.includes(s))s++;C.slot[id]=s%8}});return C}
function viewGraficos(){
  const C=selSlots();const tab=C.tab;const js=playedJs();
  const tabs=[['partido','Por partido'],['acum','Media acumulada'],['calor','Mapa de calor'],['total','Resumen']];
  let body='';
  if(!js.length)body=`<div class="card empty"><h2>Aún no hay partidos jugados</h2><p>Los gráficos aparecerán cuando registres el primer partido.</p></div>`;
  else if(tab==='partido'||tab==='acum')body=lineBlock(C,tab,js);
  else if(tab==='calor')body=heatBlock(js);
  else body=totalBlock(js);
  return `<div class="page"><div class="stick"><div class="seg" role="tablist">${tabs.map(([k,l])=>`<button data-act="gtab" data-t="${k}" aria-pressed="${tab===k}">${l}</button>`).join('')}</div></div>${body}</div>`;
}
function legendChips(C){return `<div class="legend" role="group" aria-label="Jugadores">${visiblePlayers().map(p=>{const on=C.sel.includes(p.id);const col=on?`var(--series-${C.slot[p.id]+1})`:'var(--line)';
  return `<button class="lchip" data-act="gsel" data-id="${p.id}" aria-pressed="${on}"><span class="dot" style="background:${col}"></span>${esc(p.name)}</button>`}).join('')}</div>`}
function lineBlock(C,tab,js){
  const title=tab==='partido'?'Minutos en cada partido':'Evolución de la media de minutos';
  const sub=tab==='partido'?'Huecos en la línea: partidos en los que el jugador no estaba convocado.':(C.basis==='total'?'Media acumulada sobre los partidos jugados por el equipo.':'Media acumulada sobre los partidos en que estuvo convocado.');
  const tbl=`<details><summary>Ver datos en tabla</summary><div class="tbl-wrap"><table><thead><tr><th class="l">Jugador</th>${js.map(j=>`<th>J${j}</th>`).join('')}</tr></thead><tbody>${C.sel.map(id=>{const p=pById(id);const st=stats(p);const vals=tab==='partido'?st.series:cumSeries(st,C.basis);return `<tr><td class="l name">${esc(p.name)}</td>${vals.map(v=>`<td class="num">${v==null?'—':(tab==='partido'?v:fmt1(v))}</td>`).join('')}</tr>`}).join('')}</tbody></table></div></details>`;
  return `<section class="card"><h2>${title}</h2><p class="sub">${sub}</p>
   ${tab==='acum'?`<div class="seg" style="margin-bottom:12px;max-width:460px"><button data-act="basis" data-b="total" aria-pressed="${C.basis==='total'}">Partidos totales</button><button data-act="basis" data-b="conv" aria-pressed="${C.basis==='conv'}">Convocatorias</button></div>`:''}
   <div class="row" style="margin-bottom:12px"><span class="lbl">Jugadores</span><span class="spacer"></span><button class="btn ghost sm" data-act="gnone">Ninguno</button></div>
   ${legendChips(C)}
   ${C.sel.length?`<div class="chartbox" style="margin-top:14px"><canvas id="cv" role="img" aria-label="${title}"></canvas></div>${tbl}`:`<div class="note" style="margin-top:14px">Elige al menos un jugador para ver el gráfico. Máximo 8 a la vez.</div>`}</section>`;
}
function heatBlock(js){
  const ps=visiblePlayers().map(stats).sort((a,b)=>b.total-a.total);
  const head=js.map(j=>{const f=FJ[j];return `<th title="J${j} · ${esc(TEAMS[f.rival].name)}"><img src="${crest(f.rival)}" alt="">J${j}</th>`}).join('');
  const rows=ps.map(s=>`<tr><td class="pn">${esc(s.p.name)}</td>${s.series.map(v=>{if(v==null)return `<td class="na" title="No convocado"></td>`;const k=Math.round(v/MIN*100);return `<td style="background:color-mix(in srgb,var(--accent) ${Math.max(6,k)}%,var(--surface));color:${k>52?'#fff':'var(--ink)'}">${v}</td>`}).join('')}<td class="tot num">${s.total}</td></tr>`).join('');
  return `<section class="card"><h2>Mapa de calor</h2><p class="sub">Minutos por jugador y partido. Más oscuro, más minutos. Rayado: no convocado.</p><div class="tbl-wrap"><table class="heat"><thead><tr><th></th>${head}<th>Total</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function totalBlock(js){
  const ps=visiblePlayers().map(stats).sort((a,b)=>b.total-a.total);
  const used=js.map(j=>Object.values(mat(j).minutes||{}).filter(v=>v>0).length);
  const avgUsed=used.length?used.reduce((a,b)=>a+b,0)/used.length:0;
  const totalMin=js.reduce((a,j)=>a+sumOf(mat(j).minutes||{}),0);
  const top=ps[0];const zero=ps.filter(s=>s.conv===0).length;
  const ok=js.filter(j=>sumOf(mat(j).minutes||{})===TEAM_TOTAL).length;
  return `<section class="card"><h2>Resumen de la temporada</h2><div class="kpis" style="margin-top:8px">
   <div class="kpi"><b class="num">${js.length}</b><span>partidos jugados</span></div>
   <div class="kpi"><b class="num">${fmt1(avgUsed)}</b><span>jugadores usados por partido</span></div>
   <div class="kpi"><b class="num">${top?esc(top.p.name.split(' ')[0]):'—'}</b><span>más minutos (${top?top.total+"'":''})</span></div>
   <div class="kpi"><b class="num">${ok}/${js.length}</b><span>partidos que suman ${TEAM_TOTAL}'</span></div></div>
   <p class="sub" style="margin-top:14px">${totalMin}' repartidos entre ${ps.filter(s=>s.total>0).length} jugadores${zero?` · ${zero} sin convocatorias`:''}.</p>
   <div class="chartbox" style="height:${Math.max(260,ps.length*28+40)}px"><canvas id="cv" role="img" aria-label="Minutos totales por jugador"></canvas></div></section>`;
}
function afterRender(){
  if(ui.view!=='graficos'||!window.Chart||!document.getElementById('cv'))return;
  const P=palette(),C=ui.charts,js=playedJs();const cv=document.getElementById('cv');
  Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;Chart.defaults.color=P.ink2;
  const common={responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false}};
  if(C.tab==='partido'||C.tab==='acum'){
    const labels=js.map(j=>[`J${j}`,TEAMS[FJ[j].rival].short]);
    const ds=C.sel.map(id=>{const p=pById(id),st=stats(p);const d=C.tab==='partido'?st.series:cumSeries(st,C.basis);const col=P.s[C.slot[id]];
      return {label:p.name,data:d.map(v=>v==null?null:(C.tab==='partido'?v:Math.round(v*10)/10)),borderColor:col,backgroundColor:col,borderWidth:2,pointRadius:4,pointHoverRadius:6,pointBorderColor:P.surface,pointBorderWidth:2,tension:0,spanGaps:false}});
    charts.push(new Chart(cv,{type:'line',data:{labels,datasets:ds},options:{...common,
      scales:{x:{grid:{display:false},ticks:{color:P.ink2,maxRotation:0}},y:{min:0,max:70,ticks:{stepSize:10,color:P.ink2},grid:{color:P.grid},border:{display:false},title:{display:true,text:'Minutos',color:P.ink2}}},
      plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>{const j=js[items[0].dataIndex];const f=FJ[j];const [a,b]=teamsOf(f);return `J${j} · ${TEAMS[a].name} – ${TEAMS[b].name}`},label:c=>` ${c.dataset.label}: ${c.parsed.y==null?'—':fmt1(c.parsed.y)+(C.tab==='partido'?"'":' min')}`}}}}}));
  }else if(C.tab==='total'){
    const ps=visiblePlayers().map(stats).sort((a,b)=>b.total-a.total);
    charts.push(new Chart(cv,{type:'bar',data:{labels:ps.map(s=>s.p.name),datasets:[{data:ps.map(s=>s.total),backgroundColor:P.accent,borderRadius:4,barThickness:16}]},
      options:{...common,indexAxis:'y',interaction:{mode:'nearest',intersect:true},scales:{x:{grid:{color:P.grid},border:{display:false},ticks:{color:P.ink2}},y:{grid:{display:false},ticks:{color:P.ink,autoSkip:false}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.x}' en total`}}}}}));
  }
}

/* ---------- Minutos manuales ---------- */
function manualJ(){if(ui.manual.j)return ui.manual.j;const pl=playedJs();return nextMatch()?nextMatch().j:(pl.length?Math.max(...pl):1)}
function loadDraft(j){const m=mat(j);const d={};Object.entries(m.minutes||{}).forEach(([k,v])=>d[k]=String(v));ui.manual.draft=d;ui.manual.loaded=j}
function viewManual(){
  const j=manualJ();ui.manual.j=j;if(ui.manual.loaded!==j)loadDraft(j);
  const f=FJ[j],m=mat(j),D=ui.manual.draft;
  const sel=`<select id="msel" data-bind="msel" aria-label="Jornada">${FIX.map(x=>{const [a,b]=teamsOf(x);return `<option value="${x.j}" ${x.j===j?'selected':''}>J${x.j} · ${TEAMS[a].name} – ${TEAMS[b].name}${mat(x.j).status==='played'?' ✓':''}</option>`}).join('')}</select>`;

   <input type="number" inputmode="numeric" min="0" max="70" step="1" placeholder="—" id="mi-${p.id}" data-bind="mi" data-id="${p.id}" value="${esc(D[p.id]??'')}" aria-label="Minutos de ${esc(p.name)}">
   <span class="q"><button data-act="mset" data-id="${p.id}" data-v="70">70</button><button data-act="mset" data-id="${p.id}" data-v="" aria-label="No convocado">${ic('x')}</button></span></div>`).join('');
  return `<div class="page"><div class="card"><div class="lbl" style="margin-bottom:6px">Partido</div>${sel}
   <div class="mmeta" style="margin-top:10px">${esc(fdate(f.date,true))} · ${STATUS[m.status]?.[0]||'Pendiente'}</div>
   ${m.status==='live'?'<div class="note warn" style="margin-top:10px">Este partido está en curso con cambios. Si guardas minutos aquí, sustituyen a los cambios.</div>':''}</div>
   <section class="card"><h2>Minutos por jugador</h2><p class="sub">Deja vacío al jugador que no fue convocado. Escribe 0 si fue convocado y no jugó.</p>${rows}</section>
   <div class="totalbar"><span id="mtot">${manualTotal()}</span><span class="spacer"></span><button class="btn ghost sm" data-act="mclear">${ic('trash')} Vaciar partido</button><button class="btn" data-act="msave">${ic('check')} Guardar minutos</button></div></div>`;
}
function manualTotal(){const D=ui.manual.draft||{};let t=0,c=0;Object.values(D).forEach(v=>{if(v!==''&&v!=null&&!isNaN(+v)){t+=+v;c++}});const d=t-TEAM_TOTAL;
  return `<b class="num">${t}'</b> · ${c} convocados · ${t===TEAM_TOTAL?'cuadra con 770′':(d>0?'+':'')+d+" sobre 770′"}`}

function viewDatos(){

async function ghFinish(c){
  try{
    const rem=await GH.get(c);
    const hasLocal=S.players.length||Object.keys(S.matches).length;
    const remHas=!rem.missing&&((rem.data.players||[]).length||Object.keys(rem.data.matches||{}).length);
    const go=async()=>{
      ui.sheet=null;ui.gh.token='';GH.cfg=c;try{localStorage.setItem(GHK,JSON.stringify(c))}catch(e){}
      Store.mode='gh';S.mode='gh';GH.sha=null;
      if(remHas){GH.sha=rem.sha;Store.dirty=false;Store.adopt(rem.data);setSync('ok');toast('Conectado: datos cargados de GitHub')}
      else{Store.dirty=true;Store.rev++;await Store.sync();toast('Conectado: datos subidos a GitHub')}
      render()};
    if(remHas&&hasLocal)ask('Ya hay datos en GitHub y en este dispositivo','Se usarán los de GitHub y los de este dispositivo se sustituirán. Si quieres conservarlos, guarda antes una copia de seguridad.','Usar los de GitHub',go,true);
    else await go();
  }catch(e){toast(ghMsg(e))}}

    if(d){await d.save({filename:name,data:typeof data==='string'?data:new Blob([data],{type:mime||'application/octet-stream'})});toast('Archivo listo');return}}
  catch(e){if(e&&e.code==='declined')return;if(e&&e.code&&e.code!=='unavailable'&&e.code!=='not_granted'&&e.code!=='capability_disabled'){toast('No se pudo guardar el archivo.');return}}
  try{const b=new Blob([data],{type:mime||'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){toast('Este navegador no permite descargar el archivo.')}
}

  rk.addRow(['RANKING','JUGADOR','MITJANA MINUTS (PARTITS JUGATS)',null,'RANKING','JUGADOR','MITJANA MINUTS TOTALS']);

  rk.getRow(1).eachCell(c=>{c.fill=fill(GARNET);c.font={bold:true,color:{argb:'FFFFFFFF'}};c.alignment={wrapText:true,vertical:'middle'}});
  [3,7].forEach(c=>rk.getColumn(c).numFmt='0.0');rk.getColumn(2).width=24;rk.getColumn(6).width=24;rk.getColumn(3).width=18;rk.getColumn(7).width=18;rk.getRow(1).height=34;
  const buf=await wb.xlsx.writeBuffer();
  await saveFile('Minuts_2026_2027.xlsx',buf,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
